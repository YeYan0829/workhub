name: Repository checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  public-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check tracked public files and links
        run: python3 scripts/check-public-tree.py --staged
      - name: Check publication guard regressions
        run: python3 scripts/test-public-tree.py

  java-tests:
    needs: public-tree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: maven:3.9.11-eclipse-temurin-17@sha256:e4a7ace3dc0d645ed97f8d9ad0b0d3f0b14fa8d150138f27f116d7105a639b82
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run Java 17 unit tests
        run: mvn -B -ntp test

  docker-build:
    needs: [public-tree, java-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build application image from source
        run: docker build --progress plain --tag workhub:ci .
