name: workhub
services:
  app:
    profiles: [app]
    image: ${WORKHUB_IMAGE:-workhub:local}
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SERVER_ADDRESS: 0.0.0.0
      APP_PORT: 8080
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-workhub}
      MYSQL_USER: ${MYSQL_USER:-workhub}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run scripts/init-env.py}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-workhub}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Run scripts/init-env.py}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_AUTH: 'false'
      SMTP_STARTTLS: 'false'
      WORKHUB_PUBLIC_URL: ${WORKHUB_PUBLIC_URL:-http://127.0.0.1:18080}
      WORKHUB_MAIL_FROM: ${WORKHUB_MAIL_FROM:-workhub@localhost}
      WORKHUB_MAIL_KEY_FILE: /var/lib/workhub/mail.key
      WORKHUB_MESSAGING_ENABLED: 'true'
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: 9200
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORKHUB_RETRIEVAL_ENABLED: ${WORKHUB_RETRIEVAL_ENABLED:-false}
      WORKHUB_RETRIEVAL_INDEX: ${WORKHUB_RETRIEVAL_INDEX:-workhub-text-v1}
      WORKHUB_EMBEDDING_ENABLED: ${WORKHUB_EMBEDDING_ENABLED:-false}
      WORKHUB_EMBEDDING_LEGACY_MODE: ${WORKHUB_EMBEDDING_LEGACY_MODE:-false}
      MODEL_EMBEDDING_ENDPOINT: ${MODEL_EMBEDDING_ENDPOINT:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      WORKHUB_EMBEDDING_MODEL: ${WORKHUB_EMBEDDING_MODEL:-text-embedding-v4}
      WORKHUB_EMBEDDING_DIMENSIONS: ${WORKHUB_EMBEDDING_DIMENSIONS:-1024}
      WORKHUB_EMBEDDING_CONFIG_ID: ${WORKHUB_EMBEDDING_CONFIG_ID:-2}
      WORKHUB_EMBEDDING_INDEX: ${WORKHUB_EMBEDDING_INDEX:-workhub-vector-v2}
      WORKHUB_EMBEDDING_PROTOCOL: ${WORKHUB_EMBEDDING_PROTOCOL:-dashscope}
      WORKHUB_EMBEDDING_PAID_APPROVED: ${WORKHUB_EMBEDDING_PAID_APPROVED:-false}
      WORKHUB_EMBEDDING_RUN_ID: ${WORKHUB_EMBEDDING_RUN_ID:-}
      WORKHUB_EMBEDDING_BUDGET_USD: ${WORKHUB_EMBEDDING_BUDGET_USD:-1}
      WORKHUB_MODEL_MASTER_KEY: ${WORKHUB_MODEL_MASTER_KEY:-}
      WORKHUB_AGENT_LEGACY_MODE: ${WORKHUB_AGENT_LEGACY_MODE:-false}
      WORKHUB_AGENT_ENABLED: ${WORKHUB_AGENT_ENABLED:-false}
      WORKHUB_GLM_MODEL: ${WORKHUB_GLM_MODEL:-glm-4.7}
      WORKHUB_GLM_ENDPOINT: ${WORKHUB_GLM_ENDPOINT:-https://api.z.ai/api/paas/v4/chat/completions}
      WORKHUB_GLM_API_KEY: ${WORKHUB_GLM_API_KEY:-}
      WORKHUB_GLM_PAID_APPROVED: ${WORKHUB_GLM_PAID_APPROVED:-false}
      WORKHUB_GLM_AUTHORIZATION_ID: ${WORKHUB_GLM_AUTHORIZATION_ID:-}
      WORKHUB_GLM_BUDGET_USD: ${WORKHUB_GLM_BUDGET_USD:-0}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      ARK_API_KEY: ${ARK_API_KEY:-}
      WORKHUB_MODEL_ADMISSION_ENABLED: ${WORKHUB_MODEL_ADMISSION_ENABLED:-false}
      WORKHUB_MODEL_QUOTA_SCOPE: ${WORKHUB_MODEL_QUOTA_SCOPE:-}
      WORKHUB_MODEL_RATE: ${WORKHUB_MODEL_RATE:-2}
      WORKHUB_MODEL_BURST: ${WORKHUB_MODEL_BURST:-1}
      MODEL_ADMISSION_REDIS_HOST: model-admission-redis
      MODEL_ADMISSION_REDIS_PORT: 6379
      MODEL_ADMISSION_REDIS_PASSWORD: ${MODEL_ADMISSION_REDIS_PASSWORD:-}
      WORKHUB_GITHUB_ENABLED: ${WORKHUB_GITHUB_ENABLED:-false}
      WORKHUB_GITHUB_DISPATCH_ENABLED: ${WORKHUB_GITHUB_DISPATCH_ENABLED:-false}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY_FILE: ${GITHUB_APP_PRIVATE_KEY_FILE:-}
      GITHUB_APP_INSTALL_URL: ${GITHUB_APP_INSTALL_URL:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
    ports: ["127.0.0.1:${APP_PORT:-18080}:8080"]
    volumes:
      - app-data:/var/lib/workhub
    mem_limit: 768m
    cpus: 2
    stop_grace_period: 30s
  mailpit:
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    # Local delivery must not wait for container/client reverse-DNS resolution.
    command: [--smtp-disable-rdns]
    profiles: [app, async, full]
    ports: ["127.0.0.1:${SMTP_PORT:-11025}:1025", "127.0.0.1:${MAILPIT_PORT:-18025}:8025"]
    mem_limit: 128m
  mysql:
    image: mysql:8.4.11@sha256:85b9bf2e29cf836ecb8c2a15a935d4ba0c606631dff1dd79531a11983c638f2a
    profiles: [app, minimal, async, retrieval, full]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-workhub}
      MYSQL_USER: ${MYSQL_USER:-workhub}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run scripts/init-env.py}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run scripts/init-env.py}
    command: [--innodb-buffer-pool-size=134217728, --max-connections=30, --performance-schema=ON, --log-bin-trust-function-creators=ON]
    ports: ["127.0.0.1:${MYSQL_PORT:-13306}:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/mysql-init.sh:/docker-entrypoint-initdb.d/10-contract-db.sh:ro
    mem_limit: 768m
    cpus: 2
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -u"$$MYSQL_USER" -D"$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 4s
      retries: 40
      start_period: 30s
  rabbitmq:
    hostname: rabbitmq
    image: rabbitmq:4.3.5@sha256:078107e036374f4d9bbeab8766799abe474bf252aedb4617ddd2edfa8e2c2c05
    profiles: [app, async, retrieval, full]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-workhub}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Run scripts/init-env.py}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: '+S 2:2'
      RABBITMQ_CTL_ERL_ARGS: '+S 2:2'
    ports: ["127.0.0.1:${RABBITMQ_PORT:-15672}:5672"]
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    mem_limit: 384m
    cpus: 2
    healthcheck:
      # The probe must not create a root-owned cookie during first boot.
      test: [CMD, gosu, rabbitmq, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 30s
      retries: 20
      start_period: 60s
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.3@sha256:f456578fc2a620a8a4f4c21d070fff1f6070345adb2be5e5626b65be72aea350
    profiles: [retrieval, full]
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      xpack.license.self_generated.type: basic
      xpack.ml.enabled: 'false'
      ES_JAVA_OPTS: '-Xms384m -Xmx384m -XX:ActiveProcessorCount=2'
    ports: ["127.0.0.1:${ELASTICSEARCH_PORT:-19200}:9200"]
    volumes: [elasticsearch-data:/usr/share/elasticsearch/data]
    mem_limit: 1024m
    cpus: 2
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=3s" >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  redis:
    image: redis:8.2.9@sha256:7d1e4ce8b9395088377ab382d1f6cfdbd13b3690795198a0399ab8d683064d6d
    profiles: [full]
    command: [redis-server, --save, '', --appendonly, 'no', --maxmemory, 64mb, --maxmemory-policy, allkeys-lru]
    ports: ["127.0.0.1:${REDIS_PORT:-16379}:6379"]
    mem_limit: 128m
    cpus: 1
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
  model-admission-redis:
    image: redis:8.2.9@sha256:7d1e4ce8b9395088377ab382d1f6cfdbd13b3690795198a0399ab8d683064d6d
    profiles: [model-governance]
    command: [redis-server, --save, '', --appendonly, 'no', --maxmemory, 64mb, --maxmemory-policy, noeviction]
    ports: ["127.0.0.1:${MODEL_ADMISSION_REDIS_PORT:-16380}:6379"]
    mem_limit: 128m
    cpus: 1
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  app-data:
  mysql-data:
  rabbitmq-data:
  elasticsearch-data:
